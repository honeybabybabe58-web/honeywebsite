<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Honey | Be With Honey</title>


    <style>

        /* ==============================
           BASIC SETUP
        ============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #151515 0%,
                    #080808 45%,
                    #030303 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            padding: 45px 20px;

            overflow-x: hidden;
        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {

            width: 100%;

            max-width: 620px;

            text-align: center;
        }


        /* ==============================
           PROFILE PICTURE
        ============================== */

        .profile {

            width: 145px;
            height: 145px;

            margin: 0 auto 25px;

            padding: 4px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #66d9ff,
                    #008cff,
                    #ffffff
                );

            box-shadow:
                0 0 15px rgba(0, 174, 255, 0.45),
                0 0 35px rgba(0, 174, 255, 0.18);

            animation: glow 3s ease-in-out infinite;
        }


        .profile img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #090909;

            display: block;
        }


        /* ==============================
           PROFILE GLOW
        ============================== */

        @keyframes glow {

            0% {

                box-shadow:
                    0 0 12px rgba(0, 174, 255, 0.35);
            }

            50% {

                box-shadow:
                    0 0 28px rgba(0, 174, 255, 0.55);
            }

            100% {

                box-shadow:
                    0 0 12px rgba(0, 174, 255, 0.35);
            }
        }


        /* ==============================
           NAME
        ============================== */

        h1 {

            font-size: 48px;

            font-weight: 700;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }


        /* ==============================
           TAGLINE
        ============================== */

        .subtitle {

            color: #858585;

            font-size: 14px;

            letter-spacing: 6px;

            font-weight: 500;

            margin-bottom: 48px;
        }


        /* ==============================
           LINKS
        ============================== */

        .links {

            display: flex;

            flex-direction: column;

            gap: 17px;
        }


        .link-card {

            position: relative;

            width: 100%;

            min-height: 92px;

            padding: 15px 20px;

            display: flex;

            align-items: center;

            text-decoration: none;

            color: white;

            background: rgba(24, 24, 24, 0.95);

            border: 1px solid #303030;

            border-radius: 27px;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        /* ==============================
           HOVER
        ============================== */

        .link-card:hover {

            transform: translateY(-4px);

            background: #1d1d1d;

            border-color: #00bfff;

            box-shadow:
                0 8px 30px rgba(0, 174, 255, 0.12);
        }


        /* ==============================
           CLICK
        ============================== */

        .link-card:active {

            transform: scale(0.97);
        }


        /* ==============================
           ICON
        ============================== */

        .icon {

            width: 57px;
            height: 57px;

            flex-shrink: 0;

            margin-right: 20px;

            border-radius: 17px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #292929;

            font-size: 24px;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        .link-card:hover .icon {

            transform: scale(1.08);

            background: #333333;
        }


        /* ==============================
           LINK TEXT
        ============================== */

        .text {

            flex: 1;

            text-align: left;
        }


        .title {

            font-size: 18px;

            font-weight: 600;

            margin-bottom: 5px;
        }


        .username {

            color: #858585;

            font-size: 13px;
        }


        /* ==============================
           ARROW
        ============================== */

        .arrow {

            color: #666;

            font-size: 30px;

            line-height: 1;

            margin-left: 10px;

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }


        .link-card:hover .arrow {

            color: #00bfff;

            transform: translateX(5px);
        }


        /* ==============================
           MESSAGE POPUP
        ============================== */

        .message-popup {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.75);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 9999;
        }


        .message-box {

            position: relative;

            width: 100%;

            max-width: 450px;

            background: #151515;

            border: 1px solid #303030;

            border-radius: 25px;

            padding: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);

            animation: popup 0.2s ease;
        }


        /* ==============================
           POPUP ANIMATION
        ============================== */

        @keyframes popup {

            from {

                opacity: 0;

                transform: scale(0.95);
            }

            to {

                opacity: 1;

                transform: scale(1);
            }
        }


        /* ==============================
           MESSAGE TITLE
        ============================== */

        .message-box h2 {

            font-size: 25px;

            margin-bottom: 8px;
        }


        .message-box p {

            color: #858585;

            font-size: 13px;

            margin-bottom: 22px;
        }


        /* ==============================
           INPUTS
        ============================== */

        .message-box input,
        .message-box textarea {

            width: 100%;

            background: #222;

            color: white;

            border: 1px solid #333;

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 12px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            outline: none;
        }


        .message-box input:focus,
        .message-box textarea:focus {

            border-color: #00bfff;
        }


        .message-box textarea {

            resize: vertical;

            min-height: 120px;
        }


        /* ==============================
           CLOSE BUTTON
        ============================== */

        .close-message {

            position: absolute;

            top: 12px;

            right: 17px;

            background: none;

            border: none;

            color: #777;

            font-size: 28px;

            cursor: pointer;

            transition: 0.2s;
        }


        .close-message:hover {

            color: white;

            transform: scale(1.1);
        }


        /* ==============================
           SEND BUTTON
        ============================== */

        .send-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 14px;

            background: #292929;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        .send-button:hover {

            background: #00bfff;

            color: black;
        }


        .send-button:active {

            transform: scale(0.97);
        }


        /* ==============================
           FOOTER
        ============================== */

        .footer {

            margin-top: 40px;

            color: #555;

            font-size: 12px;

            letter-spacing: 2px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            body {

                padding: 35px 15px;
            }


            .container {

                max-width: 500px;
            }


            .profile {

                width: 125px;

                height: 125px;
            }


            h1 {

                font-size: 40px;
            }


            .subtitle {

                font-size: 12px;

                letter-spacing: 4px;

                margin-bottom: 38px;
            }


            .links {

                gap: 14px;
            }


            .link-card {

                min-height: 82px;

                padding: 13px 16px;

                border-radius: 23px;
            }


            .icon {

                width: 50px;

                height: 50px;

                margin-right: 16px;

                border-radius: 15px;

                font-size: 21px;
            }


            .title {

                font-size: 16px;
            }


            .username {

                font-size: 12px;
            }


            .arrow {

                font-size: 27px;
            }


            .message-box {

                padding: 25px 20px;

                border-radius: 22px;
            }


            .message-box h2 {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- ==============================
             PROFILE
        ============================== -->

        <div class="profile">

            <img
                src="profile.jpg"
                alt="Honey's profile picture"
            >

        </div>


        <!-- ==============================
             NAME
        ============================== -->

        <h1>Honey.</h1>


        <!-- ==============================
             TAGLINE
        ============================== -->

        <p class="subtitle">
            Tap below to explore.
        </p>


        <!-- ==============================
             LINKS
        ============================== -->

        <div class="links">


            <!-- ==========================
                 INSTAGRAM
            =========================== -->

            <a
                class="link-card"
                href="https://www.instagram.com/hon3ydaniels/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">
                    ◎
                </div>


                <div class="text">

                    <div class="title">
                        Instagram
                    </div>

                    <div class="username">
                        @hon3ydaniels
                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- ==========================
                 ROBLOX
            =========================== -->

            <a
                class="link-card"
                href="https://www.roblox.com/users/profile?username=Wagon_Alfred"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">
                    ◇
                </div>


                <div class="text">

                    <div class="title">
                        Roblox
                    </div>

                    <div class="username">
                        Wagon_Alfred
                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- ==========================
                 TIKTOK
            =========================== -->

            <a
                class="link-card"
                href="https://www.tiktok.com/@honeydani3ls"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">
                    ♪
                </div>


                <div class="text">

                    <div class="title">
                        TikTok
                    </div>

                    <div class="username">
                        @honeydani3ls
                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- ==========================
                 LEAVE A MESSAGE
            =========================== -->

            <div
                class="link-card"
                onclick="openMessage()"
            >

                <div class="icon">
                    ✉
                </div>


                <div class="text">

                    <div class="title">
                        Leave a Message
                    </div>

                    <div class="username">
                        Say something to Honey
                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            </div>


        </div>


        <!-- ==============================
             MESSAGE POPUP
        ============================== -->

        <div
            id="messagePopup"
            class="message-popup"
        >

            <div class="message-box">


                <!-- CLOSE -->

                <button
                    class="close-message"
                    onclick="closeMessage()"
                    type="button"
                >
                    ×
                </button>


                <h2>
                    Leave a Message
                </h2>


                <p>
                    Send something nice to Honey ♡
                </p>


                <!-- ==========================
                     FORMSPREE FORM
                =========================== -->

                <form
                    action="https://formspree.io/f/xbglaplo"
                    method="POST"
                >

                    <!-- NAME -->

                    <input
                        type="text"
                        name="name"
                        placeholder="Your name"
                        maxlength="50"
                        required
                    >


                    <!-- MESSAGE -->

                    <textarea
                        name="message"
                        placeholder="Write your message..."
                        maxlength="1000"
                        required
                    ></textarea>


                    <!-- EMAIL SUBJECT -->

                    <input
                        type="hidden"
                        name="_subject"
                        value="New message from Honey's website"
                    >


                    <!-- SEND -->

                    <button
                        type="submit"
                        class="send-button"
                    >
                        Send Message
                    </button>

                </form>


            </div>

        </div>


        <!-- ==============================
             FOOTER
        ============================== -->

        <div class="footer">
            Nothing else here...
        </div>


    </main>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        function openMessage() {

            document.getElementById(
                "messagePopup"
            ).style.display = "flex";

        }


        function closeMessage() {

            document.getElementById(
                "messagePopup"
            ).style.display = "none";

        }


        /* Close when clicking outside the box */

        document.getElementById(
            "messagePopup"
        ).addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    document.getElementById("messagePopup")
                ) {

                    closeMessage();

                }

            }
        );


        /* Close with ESC */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeMessage();

                }

            }
        );

    </script>


</body>

</html>
